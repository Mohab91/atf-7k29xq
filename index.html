:root{--g9:#0B2B1F;--g7:#14452F;--g5:#1F5A3E;--bu:#7A0D1E;--rd:#A51225;--gold:#C99A3B;--cream:#F6EFDD;--bg:#FBF7EC;--tan:#EFE0C2;--ink:#1B1B1B;--grey:#5F5F5F;--card:#fff;--line:#E3D3AE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.7 Cairo,"Geeza Pro","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
header{background:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
header .logo{width:54px;height:54px;flex:none}
header .org{display:block;color:var(--g9);font-weight:700;font-size:13px;line-height:1.2}
header h1{margin:0;font-size:19px;line-height:1.3;color:var(--bu);font-weight:700}
header small{color:var(--grey);font-size:12.5px}
.band{height:7px;flex:none;background:linear-gradient(90deg,#6E0B1B 0 14.28%,#A51225 0 28.57%,#14452F 0 42.85%,#0B2B1F 0 57.14%,#14452F 0 71.42%,#A51225 0 85.71%,#6E0B1B 0)}
.band.b{background:linear-gradient(90deg,#0B2B1F 0 14.28%,#14452F 0 28.57%,#A51225 0 42.85%,#C99A3B 0 57.14%,#A51225 0 71.42%,#14452F 0 85.71%,#0B2B1F 0)}
main{flex:1;overflow:auto;padding:14px 14px 110px;-webkit-overflow-scrolling:touch}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5;flex-wrap:wrap}
nav::before{content:"";flex:0 0 100%;height:5px;background:linear-gradient(90deg,#0B2B1F 0 14.28%,#14452F 0 28.57%,#A51225 0 42.85%,#C99A3B 0 57.14%,#A51225 0 71.42%,#14452F 0 85.71%,#0B2B1F 0)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--grey);font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--bu);font-weight:700}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:var(--g9);color:var(--gold);font-size:34px;line-height:1;box-shadow:0 6px 18px rgba(11,43,31,.35);cursor:pointer;z-index:6}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16.5px;color:var(--g9);padding-bottom:4px;border-bottom:2px solid var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--g9);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--g9)}
.btn.p{background:var(--g9);color:var(--gold);border-color:var(--gold)}
.btn.wa{background:var(--g7);border-color:var(--gold);color:var(--gold)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.d{color:var(--bu);border-color:var(--bu)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.chip{display:inline-block;padding:0 10px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);color:var(--grey);background:var(--cream);white-space:nowrap}
.chip.ok{background:var(--g7);color:var(--gold);border-color:var(--g7)}.chip.bad{color:var(--bu);border-color:var(--bu);background:#fff}.chip.t{color:var(--g7);border-color:var(--g7);background:#fff}.chip.m{background:var(--bu);color:var(--gold);border-color:var(--bu)}.chip.w{background:var(--tan);color:var(--bu);border-color:var(--gold)}
.meta{font-size:13.5px;color:var(--grey)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-size:18px;color:var(--g9);text-align:center}.mh .hj{display:block;font-size:12.5px;color:var(--grey);font-weight:400}
.mh button{width:44px;height:44px;border-radius:10px;border:1px solid var(--g9);background:#fff;color:var(--g9);font-size:22px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-size:12px;color:var(--gold);background:var(--g9);padding:4px 0;border-radius:6px;font-weight:700}
.day{aspect-ratio:1/1.05;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:15px;padding:0;color:var(--ink)}
.day:nth-child(7n+8){background:var(--cream)}
.day.o{opacity:.35}.day.today{border:2px solid var(--gold);font-weight:800}.day.sel{background:var(--g9);color:var(--gold);border-color:var(--g9)}
.dots{display:flex;gap:3px;height:7px}.dot{width:7px;height:7px;border-radius:50%}.dot.t{background:var(--g5)}.dot.m{background:var(--bu)}
.day.sel .dot{box-shadow:0 0 0 1.5px var(--gold)}
.ev{border-inline-start:6px solid var(--g7);cursor:pointer}.ev.meeting{border-inline-start-color:var(--bu)}.ev.fin{opacity:.65}
.ev h3{margin:0;font-size:16px;color:var(--g9)}
.bar{height:6px;background:var(--tan);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--g7)}
.empty{text-align:center;color:var(--grey);padding:22px 8px}
.bg{position:fixed;inset:0;background:rgba(11,43,31,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:4px solid var(--gold)}
.sheet h2{margin:0 0 6px;color:var(--g9)}
label{display:block;font-size:14px;color:var(--grey);margin:12px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:8px;background:none;font-weight:700;color:var(--grey);cursor:pointer}
.seg button.on{background:var(--g9);color:var(--gold)}
.pick{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.pick input{width:22px;height:22px;flex:none;accent-color:var(--g7)}
.as{border-top:1px solid var(--line);padding:10px 0}
.note{background:var(--tan);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--g9);color:var(--gold);padding:10px 18px;border-radius:10px;z-index:30;max-width:90%;border:1px solid var(--gold)}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.chips button{border:1px solid var(--g9);background:#fff;color:var(--g9);border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:14px}.chips button.on{background:var(--g9);color:var(--gold)}
#printroot{display:none}
@media print{body.printing{display:block;overflow:visible;height:auto;background:#fff;color:#000}body.printing>*:not(#printroot){display:none!important}body.printing #printroot{display:block;direction:rtl;font-family:Cairo,Tahoma,Arial,sans-serif;padding:20px}#printroot table{width:100%;border-collapse:collapse}#printroot th{background:#0B2B1F!important;color:#C99A3B!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#printroot th,#printroot td{border:1px solid #C99A3B;padding:8px;text-align:right}#printroot .ph{display:flex;align-items:center;gap:12px;border-bottom:3px solid #C99A3B;padding-bottom:8px;margin-bottom:12px}#printroot .ph img{width:70px}#printroot h2{color:#7A0D1E;margin:0}}
.item{border-top:1px solid var(--line);padding:10px 0;cursor:pointer}.item:first-of-type{border-top:0;padding-top:0}.item b{color:var(--g9)}
nav button{position:relative}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bu);color:var(--cream);font-size:11px;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
.nav6 button{font-size:11.5px}
/* urgent = red, important = blue (clear at a glance) */
:root{--red:#C4161C;--red-bg:#FDE7E8;--blue:#1D5FA6;--blue-bg:#E4EEFA}
.chip.urg{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.chip.imp{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.card.ev.urgent{border-inline-start:7px solid var(--red);background:var(--red-bg);border-color:var(--red)}
.card.ev.important{border-inline-start:7px solid var(--blue);background:var(--blue-bg);border-color:var(--blue)}
.item.urgent{border-inline-start:5px solid var(--red);padding-inline-start:8px;background:var(--red-bg)}
.item.important{border-inline-start:5px solid var(--blue);padding-inline-start:8px;background:var(--blue-bg)}
.day.urg{background:var(--red-bg);border:2px solid var(--red);color:var(--ink);font-weight:700}
.day.imp{background:var(--blue-bg);border:2px solid var(--blue);color:var(--ink);font-weight:700}
.day.urg.today{background:var(--red);color:#fff}
.day.imp.today{background:var(--blue);color:#fff}
.day.sel.urg{background:var(--red);color:#fff;border-color:var(--g9);outline:3px solid var(--g9)}
.day.sel.imp{background:var(--blue);color:#fff;border-color:var(--g9);outline:3px solid var(--g9)}
.legend{gap:6px;margin:8px 2px 0;font-size:12.5px}
.nav7 button{font-size:10.5px}
.nav7 button svg{width:21px;height:21px}
input[type=search]{-webkit-appearance:none;appearance:none}
</style>
</head>
